    <text x="133" y="49" font-family="Newsreader, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">DOCE · FMAT</text><text x="1260" y="47" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#F4E9CF">Administración</text><text x="150" y="130" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F4E8C">P11 · RF03 · CU-03—CU-06</text><text x="150" y="178" font-family="Newsreader, Arial, sans-serif" font-size="38" font-weight="600" fill="#002855">Gestionar actividades y avisos</text><text x="150" y="210" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4352">Crea borradores, revisa su información y publícalos cuando estén completos.</text><rect x="150" y="238" width="1140" height="78" rx="6" fill="#F5F8FC" stroke="#1F4E8C"/>
    <rect x="150" y="238" width="6" height="78" rx="3" fill="#1F4E8C"/>
    <text x="178" y="267" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1526">Aviso guardado como Borrador</text><text x="178" y="293" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#3A4352">El registro aparece en la lista administrativa con su estado actualizado.</text><text x="160" y="362" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4352">Actividades</text><text x="285" y="362" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#002855">Avisos</text><rect x="270" y="374" width="82" height="3" fill="#C69214"/><rect x="920" y="340" width="160" height="46" rx="5" fill="#FFFFFF" stroke="#002855"/><text text-anchor="middle" x="1000" y="369" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#002855">Crear aviso</text><rect x="1095" y="340" width="185" height="46" rx="5" fill="#002855" stroke="#002855"/><text text-anchor="middle" x="1187.5" y="369" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Crear actividad</text><rect x="150" y="400" width="1140" height="430" rx="8" fill="#FFFFFF" stroke="#D6DBE3"/><text x="175" y="440" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1526">Avisos</text><line x1="150" y1="462" x2="1290" y2="462" stroke="#D6DBE3"/><text x="175" y="495" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="11" font-weight="700" fill="#3A4352">Nombre o título</text><text x="720" y="495" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="11" font-weight="700" fill="#3A4352">Tipo</text><text x="960" y="495" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="11" font-weight="700" fill="#3A4352">Estado</text><text x="1100" y="495" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="11" font-weight="700" fill="#3A4352">Acciones</text><line x1="150" y1="510" x2="1290" y2="510" stroke="#D6DBE3"/><text x="175" y="533" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1526">Mantenimiento de plataforma</text><text x="720" y="533" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A4352">Aviso general</text><rect x="950" y="510" width="92" height="28" rx="14" fill="#F4E9CF" stroke="#F4E9CF"/><text text-anchor="middle" x="996" y="530" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#002855">Borrador</text><text x="1100" y="533" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4E8C">Revisar y publicar</text><line x1="150" y1="592" x2="1290" y2="592" stroke="#D6DBE3"/><text x="175" y="615" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1526">Convocatoria de becas 2025</text><text x="720" y="615" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A4352">Aviso general</text><rect x="950" y="592" width="92" height="28" rx="14" fill="#1F4E8C" stroke="#1F4E8C"/><text text-anchor="middle" x="996" y="612" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Publicado</text><text x="1100" y="615" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#3A4352">Solo consulta</text><text x="155" y="860" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4352">Los borradores no son visibles para estudiantes. Publicar es una acción independiente.</text></svg>