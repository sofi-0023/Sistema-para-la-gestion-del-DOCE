    <text x="133" y="49" font-family="Newsreader, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">DOCE · FMAT</text><text x="1260" y="47" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#F4E9CF">Administración</text><text x="150" y="130" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F4E8C">P11 · RF03 · CU-03—CU-06</text><text x="150" y="178" font-family="Newsreader, Arial, sans-serif" font-size="38" font-weight="600" fill="#002855">Gestionar actividades y avisos</text><text x="150" y="210" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4352">Crea borradores, revisa su información y publícalos cuando estén completos.</text><rect x="150" y="245" width="850" height="690" rx="8" fill="#FFFFFF" stroke="#D6DBE3"/><text x="185" y="285" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#002855">CU-05 · NUEVO BORRADOR</text><text x="185" y="330" font-family="Newsreader, Arial, sans-serif" font-size="30" font-weight="600" fill="#002855">Crear aviso</text><text x="185" y="360" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="400" fill="#3A4352">El aviso no será visible para estudiantes hasta que se publique.</text><line x1="185" y1="390" x2="965" y2="390" stroke="#D6DBE3"/><text x="185" y="430" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1526">Título del aviso *</text><rect x="185" y="440" width="750" height="48" rx="5" fill="#FFFFFF" stroke="#AEB7C3"/>
    <text x="199" y="470" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="400" fill="#0B1526">Mantenimiento de plataforma</text><text x="185" y="545" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1526">Contenido del aviso *</text><rect x="185" y="555" width="750" height="150" rx="5" fill="#FFFFFF" stroke="#AEB7C3"/>
    <text x="199" y="585" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="400" fill="#0B1526">La plataforma estará en mantenimiento el sábado de 08:00 a 10:00 h.</text><rect x="185" y="860" width="130" height="46" rx="5" fill="#FFFFFF" stroke="#002855"/><text text-anchor="middle" x="250" y="889" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#002855">Cancelar</text><rect x="740" y="860" width="195" height="46" rx="5" fill="#002855" stroke="#002855"/><text text-anchor="middle" x="837.5" y="889" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Guardar borrador</text></svg>