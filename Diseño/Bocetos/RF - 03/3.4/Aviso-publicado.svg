    <text x="133" y="49" font-family="Newsreader, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">DOCE · FMAT</text><text x="1260" y="47" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#F4E9CF">Administración</text><text x="150" y="130" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F4E8C">P11 · RF03 · CU-03—CU-06</text><text x="150" y="178" font-family="Newsreader, Arial, sans-serif" font-size="38" font-weight="600" fill="#002855">Gestionar actividades y avisos</text><text x="150" y="210" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4352">Crea borradores, revisa su información y publícalos cuando estén completos.</text><rect x="150" y="245" width="1140" height="680" rx="8" fill="#FFFFFF" stroke="#D6DBE3"/><text x="185" y="285" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#002855">CU-06 · REVISIÓN</text><text x="185" y="330" font-family="Newsreader, Arial, sans-serif" font-size="30" font-weight="600" fill="#002855">Mantenimiento de plataforma</text><rect x="1125" y="275" width="120" height="30" rx="15" fill="#1F4E8C" stroke="#1F4E8C"/><text text-anchor="middle" x="1185" y="296" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Publicado</text><line x1="185" y1="365" x2="1255" y2="365" stroke="#D6DBE3"/><rect x="150" y="390" width="1140" height="78" rx="6" fill="#F5F8FC" stroke="#1F4E8C"/>
    <rect x="150" y="390" width="6" height="78" rx="3" fill="#1F4E8C"/>
    <text x="178" y="419" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1526">Aviso publicado correctamente</text><text x="178" y="445" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#3A4352">Ya está disponible en el espacio público de avisos.</text><text x="185" y="495" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="12" font-weight="700" fill="#3A4352">CONTENIDO</text><text x="185" y="527" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="400" fill="#3A4352">La plataforma estará en mantenimiento el sábado de 08:00 a 10:00 h.</text><rect x="185" y="675" width="1070" height="130" rx="8" fill="#F8F9FB" stroke="#D6DBE3"/><text x="210" y="707" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1526">Validación previa a publicación</text><text x="210" y="739" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#3A4352">✓ El registro continúa en estado Borrador</text><text x="210" y="767" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="14" font-weight="400" fill="#3A4352">✓ Los campos obligatorios tienen información válida</text><rect x="185" y="850" width="175" height="46" rx="5" fill="#FFFFFF" stroke="#002855"/><text text-anchor="middle" x="272.5" y="879" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#002855">Volver a la lista</text><rect x="1060" y="850" width="195" height="46" rx="5" fill="#002855" stroke="#002855"/><text text-anchor="middle" x="1157.5" y="879" font-family="Atkinson Hyperlegible, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Ir a la lista</text></svg>